<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DNA Motif Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <style>
        body {
            background-image: url("{{ url_for('static', filename='bio-bg.jpg') }}");
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
        }

        /* Semi-transparent overlay to improve readability 
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            height: 100%; width: 100%;
            background: rgba(255, 255, 255, 0.7);
            z-index: -1;
        }*/

        .container {
            max-width: 740px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: relative;
            margin: 40px auto;
            border: 1px solid #e0e0e0;
            animation: fadeIn 0.8s ease-out;
        }

        .corner-logo-left, .corner-logo-right {
            position: absolute;
            top: 20px;
            height: 100px;
            width: auto;
            opacity: 0.9;
            transition: transform 0.3s ease;
        }
        .corner-logo-left { 
            left: 20px;
            animation: slideInLeft 0.8s ease-out;
        }
        .corner-logo-right { 
            right: 20px;
            animation: slideInRight 0.8s ease-out;
        }
        .corner-logo-left:hover, .corner-logo-right:hover {
            transform: scale(1.05);
        }

        .header-title {
            text-align: center;
            margin: 40px 0 25px 0;
            animation: fadeInDown 1.2s ease;
        }

        h1 {
            font-weight: 700;
            color: #2c3e50;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            margin-top: 18px;
            color: #2c3e50;
            display: block;
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        /* Staggered animations for form elements */
        label:nth-child(1) { animation-delay: 0.2s; }
        label:nth-child(3) { animation-delay: 0.4s; }
        label:nth-child(5) { animation-delay: 0.6s; }

        input[type="file"], textarea {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            transition: all 0.3s ease;
        }
        input[type="file"]:hover, textarea:hover {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
        }
        input[type="file"]:focus, textarea:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
            background-color: #fff;
        }

        .btn-primary {
            background: #0d6efd;
            border: none;
            font-weight: 600;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #0b5ed7;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            animation: fadeIn 1s ease-out;
            animation-delay: 0.8s;
            animation-fill-mode: both;
        }

        .footer-logos {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .footer-logo {
            height: 30px;
            opacity: 0.8;
            transition: transform 0.3s ease;
        }
        .footer-logo:hover {
            transform: scale(1.1);
        }

        .alert {
            animation: shake 0.5s ease;
        }

        /* Keyframes for animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 0.9;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 0.9;
                transform: translateX(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
                margin: 20px auto;
            }
            .corner-logo-left, .corner-logo-right {
                height: 40px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='icarlogo.png') }}" alt="ICAR Logo" class="corner-logo-left" />
        <img src="{{ url_for('static', filename='images-4.png') }}" alt="Agri Bio Logo" class="corner-logo-right" />

        <div class="header-title">
            <h1><i class="fa-solid fa-dna me-2"></i>DNA Motif Finder</h1>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger" role="alert">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="post" enctype="multipart/form-data">
            <label for="protein_fasta"><i class="fa-solid fa-file-lines me-2"></i>Protein FASTA file</label>
            <input type="file" class="form-control" id="protein_fasta" name="protein_fasta" required />

            <label for="genome_fasta"><i class="fa-solid fa-dna me-2"></i>Genome FASTA file</label>
            <input type="file" class="form-control" id="genome_fasta" name="genome_fasta" required />

            <label for="known_motifs"><i class="fa-solid fa-align-left me-2"></i>Known Motifs (one per line)</label>
            <textarea class="form-control" id="known_motifs" name="known_motifs" rows="5" required placeholder="ATGCGTACG..."></textarea>

            <button type="submit" class="btn btn-primary mt-4 w-100">
                <i class="fa-solid fa-play me-2"></i>Run Prediction
            </button>
        </form>

        <div class="footer">
            <div class="footer-logos">
                <img src="{{ url_for('static', filename='images-4.png') }}" alt="Logo" class="footer-logo" />
                <img src="{{ url_for('static', filename='icarlogo.png') }}" alt="Logo" class="footer-logo" />
            </div>
            <p>&copy; 2025 DNA Motif Finder</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
     document.querySelector("form").addEventListener("submit", function (e) {
        const submitButton = this.querySelector("button[type=submit]");

        // Disable the button to prevent double submissions
        submitButton.disabled = true;

        // Add spinner and update text
        submitButton.innerHTML = `
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Running Prediction...
        `;

        // Optional: Visual feedback on the form
        this.style.opacity = "0.85";
    });

    // Focus and blur animation for inputs (already great)
    const inputs = document.querySelectorAll('input, textarea');
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            input.style.borderColor = "#86b7fe";
            input.style.boxShadow = "0 0 0 0.25rem rgba(13, 110, 253, 0.25)";
        });
        input.addEventListener('blur', () => {
            input.style.boxShadow = "none";
        });
         });
     </script>

</body>
</html>
